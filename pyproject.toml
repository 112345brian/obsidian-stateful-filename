[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## v{version} — {project_date}"
issue_format = "{issue}"
orphan_prefix = "+"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "feature"
name = "New"
showcontent = true

[[tool.towncrier.type]]
directory = "change"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fix"
name = "Fix"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Other"
showcontent = true
